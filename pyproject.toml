[project]
name = "voice-language-tutor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "openai",
    "httpx2>=2.13.1",
]
[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/voice_tutor"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.mypy]
python_version = "3.12"
strict = true
